# 项目级 MCP：读取**当前会话所在项目**的 `.mcp.json`，把声明的 server 挂到该会话作用域。
#
# 隔离语义（本插件的核心）：MCP 实例挂在会话作用域（`agent.ctx`）下，A 项目的会话看不到
# B 项目的任何 `mcp__*` 工具，也收不到 B 项目的 server instructions。项目由会话工作目录
# （`agent.session.header.cwd`）决定，从该目录向上找 `.mcp.json` —— 会话开在
# `Modules/Orders` 这类子目录也能找到项目根的声明。
#
# 工具名保持无前缀形态（`mcp__dbhub__execute_sql`）：不同会话可以各挂一份同名 server，
# 因为 dsh-mcp-client 的 serverName 独占是按**注册作用域**算的。
#
# 代价：一个会话一份实例 —— N 个会话同时开着就是 N 份 MCP 子进程，官方设计如此。
- insert:
    - id: mcp-json
      name: '@dongasai/dsh-project-mcp'
      config:
        path: .mcp.json
        # 从会话工作目录向上找（这是默认值，写出来是为了醒目）
        searchUp: true
        # 监视本项目的 .mcp.json：变更后先停旧实例、再起新实例
        watch: true
        # 单个 server 起不来只告警，不拖垮同一份 .mcp.json 里的其它 server
        failOnStartupError: false
